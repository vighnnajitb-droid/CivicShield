services:
  - type: web
    name: civicshield-api
    runtime: python
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    plan: starter
    healthCheckPath: /api/meta
    disk:
      name: civicshield-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: JWT_SECRET
        generateValue: true
      - key: INTERNAL_API_KEY
        sync: false
      - key: N8N_WEBHOOK_BASE
        sync: false
      - key: CIVICSHIELD_DB
        value: /var/data/civicshield.db
      - key: CIVICSHIELD_EVIDENCE_DIR
        value: /var/data/evidence
      - key: ALLOW_DEMO_ENDPOINTS
        value: "false"