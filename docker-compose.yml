# UNTESTED in the build sandbox (no Docker/network there). Start with: cp .env.example .env  (fill JWT_SECRET + INTERNAL_API_KEY)  &&  docker compose up --build
services:
  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}
      N8N_WEBHOOK_BASE: http://n8n:5678/webhook
      CIVICSHIELD_DB: /data/civicshield.db
      CIVICSHIELD_EVIDENCE_DIR: /data/evidence
      SEED_PASSWORD: ${SEED_PASSWORD:-Demo@12345}
      ALLOW_DEMO_ENDPOINTS: ${ALLOW_DEMO_ENDPOINTS:-true}
    volumes: [ "cs_data:/data" ]
    ports: [ "8000:8000" ]
    depends_on: [ n8n ]
  n8n:
    image: n8nio/n8n:latest
    environment:
      BACKEND_URL: http://backend:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}
      N8N_WEBHOOK_BASE: http://n8n:5678/webhook
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"       # workflows read $env.BACKEND_URL etc.
      NODE_FUNCTION_ALLOW_BUILTIN: crypto          # evidence workflow computes SHA-256
      N8N_PAYLOAD_SIZE_MAX: "32"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_FROM: ${SMTP_FROM:-}
      NOTIFY_FALLBACK_EMAIL: ${NOTIFY_FALLBACK_EMAIL:-}
      GENERIC_TIMEZONE: Asia/Kolkata
    volumes: [ "n8n_data:/home/node/.n8n", "./n8n-workflows:/workflows:ro" ]
    ports: [ "5678:5678" ]
volumes: { cs_data: {}, n8n_data: {} }
