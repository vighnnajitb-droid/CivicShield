<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CivicShield</title>
<style>
:root{color-scheme:light;--bg:#f5f7fa;--card:#fff;--ink:#14213d;--mut:#5b6678;--pri:#1d4ed8;--ok-bg:#dcfce7;--ok-ink:#166534;--warn-bg:#fef3c7;--warn-ink:#92400e;--bad-bg:#fee2e2;--bad-ink:#991b1b;--line:#e2e8f0;--focus:#2563eb}
:root[data-theme="dark"]{color-scheme:dark;--bg:#111827;--card:#1f2937;--ink:#e5e7eb;--mut:#aab4c3;--pri:#60a5fa;--ok-bg:#183b2b;--ok-ink:#86efac;--warn-bg:#453516;--warn-ink:#fcd34d;--bad-bg:#4b2529;--bad-ink:#fca5a5;--line:#3b4656;--focus:#93c5fd}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink);transition:background-color .15s,color .15s}
header{background:var(--pri);color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header b{font-size:18px}nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}nav a{color:#fff;padding:6px 10px;border-radius:6px;text-decoration:none;opacity:.85;cursor:pointer}nav a.on,nav a:hover{background:rgba(255,255,255,.2);opacity:1}
main{max-width:1100px;margin:16px auto;padding:0 12px}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
h2{margin:.2em 0 .5em}h3{margin:.2em 0}.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.stat b{font-size:26px;display:block}.mut{color:var(--mut);font-size:13px}table{width:100%;border-collapse:collapse}td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:14px}
input,select,textarea,button{font:inherit;padding:8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}textarea{width:100%;min-height:90px}input[type=text],input[type=email],input[type=password],input[type=date],select{width:100%}
button{background:var(--pri);color:#fff;border:0;cursor:pointer;padding:8px 14px}button.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}button.bad{background:#b91c1c;color:#fff}button:disabled{opacity:.5;cursor:not-allowed}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:var(--line)}.tag.ok{background:var(--ok-bg);color:var(--ok-ink)}.tag.warn{background:var(--warn-bg);color:var(--warn-ink)}.tag.bad{background:var(--bad-bg);color:var(--bad-ink)}
.ai{border:2px dashed var(--warn-ink);background:color-mix(in srgb,var(--warn-bg) 32%,var(--card))}.banner{padding:10px;border-radius:8px;margin:8px 0;background:color-mix(in srgb,var(--pri) 12%,var(--card))}.err{color:var(--bad-ink)}
.tl{border-left:3px solid var(--line);margin-left:6px;padding-left:12px}.tl div{margin-bottom:8px}code{font-size:12px;word-break:break-all}label{display:block;margin:8px 0 2px;font-weight:600}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
a{color:var(--pri)}input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible,.file-picker:focus-within{outline:3px solid var(--focus);outline-offset:2px}
.evidence-upload{border-style:dashed}.file-picker{display:inline-block;margin:4px 0 12px;padding:8px 14px;border:1px solid var(--pri);border-radius:6px;color:var(--pri);cursor:pointer}
.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.evidence-list{border-top:1px solid var(--line)}.evidence-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.evidence-entry-main{display:grid;gap:3px;min-width:0}.evidence-file-line{display:flex;align-items:flex-start;gap:8px;min-width:0}.evidence-status{flex:none}.evidence-name{overflow-wrap:anywhere;word-break:break-word}.evidence-actions{align-self:center;justify-content:flex-end}.upload-success{color:var(--ok-ink)}
@media(max-width:600px){.evidence-row{align-items:flex-start;flex-direction:column}.evidence-actions{align-self:flex-start}.evidence-file-line{align-items:flex-start}}
</style></head>
<body><div id="root"></div>
<script crossorigin src="react.js"></script>
<script crossorigin src="react-dom.js"></script>
<script src="htm.js"></script>
<script src="app.js"></script></body></html>
